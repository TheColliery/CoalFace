name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      # CodeQL analyzes js/ts + this room's GitHub Actions workflows (CWK-112) — NO markdown needs a security scan either way, so skip ALL docs (a doc-only commit doesn't run CodeQL). Shipped SKILL.md/commands consistency is ci.yml's job (verify dist-sync), not CodeQL's.
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  # NO paths-ignore here (CWK-120 bounce-1 F1: the ruleset `dependabot-auto-merge-gate`
  # requires BOTH `all-green` (ci.yml) AND `analyze (javascript)` (this job) as status
  # checks on every PR into main -- dropping this filter on ci.yml alone (finding #1)
  # left the identical Pending-forever failure on this job's own half of the same gate.
  # push keeps its filter: nothing is waiting on a push-triggered analyze() run, no PR
  # merge is gated on a push event. Same option this room already took for ci.yml's
  # pull_request trigger -- one flock, one colour, applied inside the room.
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

# cancel-in-progress: TRUE -- a superseded run simply never uploads its SARIF, and the
# PRIOR analysis stands: stale, never corrupt. The newer push analyzes the newer tree,
# which is the state anyone actually cares about (CWK-058, canon's `concurrency:` bullet).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (javascript)
    runs-on: ubuntu-latest
    timeout-minutes: 20 # sized from the measured run times of the last 25 runs (R14, 2026-10-02), roughly 5x the max (max 109 s)
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript, actions
          queries: security-and-quality
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
