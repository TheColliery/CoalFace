name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # skip verify/test only for NON-shipped docs — a SHIPPED markdown artifact (skills/**/SKILL.md, commands/*.md) MUST run CI (verify checks dist-sync).
      # push is safe to skip here: nothing is waiting on a push-triggered `all-green` --
      # no PR merge is gated on it (CWK-120 finding #1 -- pull_request below is the one
      # that cannot carry this filter, see its own comment for why).
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'NOTICE'
  # NO paths-ignore here (CWK-120 finding #1, CONFIRMED against this repo's OWN live
  # ruleset `dependabot-auto-merge-gate`, active, targeting every PR into main, requiring
  # the `all-green` context): GitHub's own docs are explicit -- "If a workflow is skipped
  # due to path filtering... checks associated with that workflow will remain in a
  # 'Pending' state. A pull request that requires those checks to be successful will be
  # blocked from merging." A doc-only PR would trigger no `gate` job, so `all-green`
  # would never post and the PR would sit blocked forever for anyone without bypass. The
  # gate itself is cheap (no build step, no install) -- paying it on every PR is the
  # correct trade against a permanently-stuck required check.
  pull_request:
    branches: [main]

# cancel-in-progress: TRUE -- ci.yml only reads, tests and compares; it publishes nothing
# and touches no external state, so a superseded run has nothing to leave half-done
# (CWK-058, .github/SKILL-REPO-PATTERN.md's `concurrency:` bullet -- the discriminator is
# ATOMICITY, never read-vs-write).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }} · node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]  # supported LTS only (24 Active, 22 Maintenance); 18/20 are EOL — bump as the Node LTS schedule moves
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Zero-dependency: no install step. Run the same fail-loud gate as a local pre-push,
      # cross-platform — verify (dist-sync + repo consistency checks) then the test suite.
      # No build step here: rebuilding the dist in CI would mask a stale COMMITTED
      # plugin/ — the exact drift verify exists to catch.
      - run: node scripts/verify.mjs
      - run: node scripts/test.mjs

  # A single STABLE required-check context (the matrix names drift; this does not).
  # Succeeds iff every matrix gate passed or was legitimately skipped; fails if any
  # gate failed. Rulesets require `all-green`, never the per-matrix names.
  all-green:
    name: all-green
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: gate result
        run: |
          case "${{ needs.gate.result }}" in
            success|skipped) echo "gate ${{ needs.gate.result }}"; exit 0 ;;
            *) echo "gate ${{ needs.gate.result }}"; exit 1 ;;
          esac
