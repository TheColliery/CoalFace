name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '0 6 * * 2'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'

# cancel-in-progress: FALSE -- this job uploads a SARIF AND posts to the OpenSSF API
# (publish_results: true), so a mid-flight kill can leave a PARTIALLY-APPLIED publish,
# unlike CodeQL's atomic upload-or-nothing (CWK-058, canon's `concurrency:` bullet).
# Schedule-driven, so overlap is rare and queueing costs nothing.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: results.sarif
