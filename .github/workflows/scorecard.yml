name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '0 6 * * 2'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'

# cancel-in-progress: FALSE -- this job uploads a SARIF AND posts to the OpenSSF API
# (publish_results: true), so a mid-flight kill can leave a PARTIALLY-APPLIED publish,
# unlike CodeQL's atomic upload-or-nothing (CWK-058, canon's `concurrency:` bullet).
# Schedule-driven, so overlap is rare and queueing costs nothing.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15 # sized from the measured run times of the last 25 runs (R14, 2026-10-02), roughly 5x the max (max 341 s)
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
